<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Almeida Finance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Fundo claro IMEDIATO (antes do React/CSS carregar) — evita flash.
         Mesma cor de fundo do tema claro (#F8FAFC). */
      html, body { margin: 0; background-color: #f8fafc; }
      /* Splash estático exibido instantaneamente até o React montar.
         O React remove este elemento assim que renderiza a própria Splash. */
      #splash-inicial {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background-color: #f8fafc;
      }
      #splash-inicial .spin {
        width: 38px; height: 38px; border-radius: 9999px;
        border: 3px solid rgba(15,23,42,0.12);
        border-top-color: #2855a5;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash estático: aparece já no primeiro paint, some quando o app monta -->
    <div id="splash-inicial"><div class="spin"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
